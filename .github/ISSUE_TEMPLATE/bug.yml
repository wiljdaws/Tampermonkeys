name: Bug report
description: Something in ATLAS is broken or unexpected.
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. If this is a security problem, do not use this form — see [SECURITY.md](https://github.com/wiljdaws/Tampermonkeys/blob/main/SECURITY.md).
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What did you see? What did you expect?
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: ATLAS version
      description: Settings shows this, or the `@version` line in the script.
      placeholder: "20.5"
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser
      placeholder: Chrome 128, Firefox 141, …
    validations:
      required: true
  - type: dropdown
    id: playlist
    attributes:
      label: Where it showed up
      options:
        - HUD / Settings
        - Leaderboard submit
        - Clan
        - Clan Clash
        - Name Forge
        - Ranked popups
        - Other
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Numbered steps if you have them.
    validations:
      required: true
  - type: markdown
    attributes:
      value: |
        Settings → **Download debug bundle** if you can. Strip anything you do not want public before attaching.
