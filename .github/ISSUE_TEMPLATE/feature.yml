name: Feature request
description: An idea for ATLAS, the publisher, or related tooling.
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: idea
    attributes:
      label: What do you want
      description: What should ATLAS do that it does not do today?
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why it helps
      description: Who is this for, and what problem does it solve?
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Extra notes
      description: Mockups, Discord context, or why this is not already covered.
