name: Firebase tests

on:
  workflow_dispatch:
    inputs:
      main_site_ref:
        description: rgleaderboard branch, tag, or SHA
        required: false
        default: main
      clan_site_ref:
        description: RG_Clan_Leaderboard branch, tag, or SHA
        required: false
        default: main
  pull_request:
    paths:
      - "firebase/**"
      - "rg_hud.user.js"
      - ".github/workflows/firebase-tests.yml"
  push:
    paths:
      - "firebase/**"
      - "rg_hud.user.js"
      - ".github/workflows/firebase-tests.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: firebase
    env:
      MAIN_SITE_PATH: ${{ github.workspace }}/.integration/rgleaderboard
      CLAN_SITE_PATH: ${{ github.workspace }}/.integration/RG_Clan_Leaderboard

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Check out main leaderboard
        if: github.event_name == 'workflow_dispatch'
        uses: actions/checkout@v7
        with:
          repository: AbuArqob/rgleaderboard
          ref: ${{ inputs.main_site_ref || 'main' }}
          path: .integration/rgleaderboard

      - name: Check out clan leaderboard
        if: github.event_name == 'workflow_dispatch'
        uses: actions/checkout@v7
        with:
          repository: Pal1533/RG_Clan_Leaderboard
          ref: ${{ inputs.clan_site_ref || 'main' }}
          path: .integration/RG_Clan_Leaderboard

      - name: Use Node 20
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: firebase/package-lock.json

      - name: Use Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm ci

      - name: Run Firebase suite
        run: npm run test:core

      - name: Run coordinated contract suite
        if: github.event_name == 'workflow_dispatch'
        run: npm run test:contracts
