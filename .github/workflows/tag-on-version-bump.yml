name: tag-on-version-bump

# When a push to main changes the @version line in rg_hud.user.js, push a
# matching git tag for immutable releases. Then purge jsDelivr's @main file
# cache so proxy users see the update on their next reload instead of
# waiting up to 12h for the CDN to expire it on its own.

on:
  push:
    branches: [main]
    paths:
      - rg_hud.user.js

permissions:
  contents: write

jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract version from header
        id: v
        run: |
          version=$(grep -m1 '@version' rg_hud.user.js | awk '{print $NF}')
          if [ -z "$version" ]; then
            echo "no @version line found" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

      - name: Skip if tag already exists
        id: check
        run: |
          if git rev-parse -q --verify "refs/tags/${{ steps.v.outputs.tag }}" >/dev/null; then
            echo "tag ${{ steps.v.outputs.tag }} already exists, skipping"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Push tag
        if: steps.check.outputs.skip == 'false'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "${{ steps.v.outputs.tag }}" -m "ATLAS ${{ steps.v.outputs.version }}"
          git push origin "${{ steps.v.outputs.tag }}"

      - name: Purge jsDelivr @main cache
        if: steps.check.outputs.skip == 'false'
        run: |
          curl -fsS "https://purge.jsdelivr.net/gh/${{ github.repository }}@main/rg_hud.user.js" || true
