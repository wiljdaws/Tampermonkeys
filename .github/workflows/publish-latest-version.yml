name: Publish latest HUD version

# Whenever rg_hud.user.js changes on main, sync admin/latest_version so the
# in-HUD update nudge points every client at the new build. Idempotent —
# writes are skipped when the doc already matches.

on:
  push:
    branches: [main]
    paths:
      - "rg_hud.user.js"
      - ".github/workflows/publish-latest-version.yml"
  workflow_dispatch:
    inputs:
      project:
        description: Firebase project ID
        required: false
        default: rgleaderboard
      dry_run:
        description: Plan without writing (true/false)
        required: false
        default: "false"
      bump_min_version:
        description: >-
          Also bump admin/blacklist.minVersion to the HUD @version so
          pre-cutover clients are force-updated. Only use during
          incident response — normal publishes should leave it "false".
        required: false
        default: "false"

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: firebase
    env:
      FIREBASE_PROJECT: ${{ github.event.inputs.project || 'rgleaderboard' }}
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.dry_run || 'false' }}
      BUMP_MIN_VERSION: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.bump_min_version || 'false' }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Use Node 20
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: firebase/package-lock.json

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_SA_EMAIL }}
          token_format: access_token
          create_credentials_file: true

      - name: Install dependencies
        run: npm ci

      - name: Publish latest HUD version
        env:
          GOOGLE_OAUTH_ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
        run: |
          set -euo pipefail
          args=(--project "$FIREBASE_PROJECT")
          if [[ "$DRY_RUN" == "true" ]]; then
            args+=(--dry-run)
          fi
          if [[ "$BUMP_MIN_VERSION" == "true" ]]; then
            args+=(--bump-min-version)
          fi
          npm run publish:latest-version -- "${args[@]}"
