name: Merge match snapshots

# Groups per-reporter match_snapshots by matchId into match_canonical docs.
# Every HUD in a match writes its own snapshot; this merges them so
# downstream analysis has one row per match instead of N (one per HUD).
#
# GitHub cron on public repos deprioritizes frequent cadences on the free
# tier — same story as publish-leaderboard-json. We schedule daily as a
# safety net; the real cadence should be driven by cron-job.org calling
# workflow_dispatch every 15 min (same pattern as the publisher).

on:
  schedule:
    # Safety-net daily run at 10:33 UTC. Frequent 15-min runs come from
    # cron-job.org via workflow_dispatch.
    - cron: "33 10 * * *"
  workflow_dispatch:
    inputs:
      project:
        description: GCP project ID
        required: false
        default: rgleaderboard
      window_minutes:
        description: Look-back window in minutes (default 20)
        required: false
        default: "20"
      dry_run:
        description: Plan without writing (true/false)
        required: false
        default: "false"

permissions:
  contents: read
  id-token: write

concurrency:
  group: merge-match-snapshots
  cancel-in-progress: false

jobs:
  merge:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PROJECT: ${{ inputs.project || 'rgleaderboard' }}
      WINDOW_MINUTES: ${{ inputs.window_minutes || '20' }}
      DRY_RUN: ${{ inputs.dry_run || 'false' }}

    steps:
      - name: Check out Tampermonkeys
        uses: actions/checkout@v7

      - name: Use Node 20
        uses: actions/setup-node@v7
        with:
          node-version: "20"

      - name: Install builder dependencies
        working-directory: firebase
        run: npm ci

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_SA_EMAIL }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: ${{ env.PROJECT }}

      - name: Run merge
        working-directory: firebase
        run: |
          ARGS="--project $PROJECT --window-minutes $WINDOW_MINUTES"
          if [ "$DRY_RUN" = "true" ]; then
            ARGS="$ARGS --dry-run"
          fi
          node scripts/merge-match-snapshots.mjs $ARGS
