name: Deploy leaderboard rebuild service

# Deploys the Cloud Run service that rebuilds top-100 leaderboard JSON blobs
# and uploads them to Cloudflare R2. Uses `gcloud run deploy --source` so the
# firebase/ directory is packaged as a buildpack image on each push.
#
# Correctness for the underlying rebuild code is gated by firebase-tests.yml
# (rules + emulator + cache-builder unit tests) — this workflow assumes those
# already pass on main and just ships the artifact.
#
# Auth: reuses the existing WIF pattern from firestore-aggregates.yml and
# publish-latest-version.yml (GCP_WIF_PROVIDER + GCP_SA_EMAIL secrets).
#
# R2 credentials and the rebuild shared secret live in GCP Secret Manager;
# see firebase/scripts/README-deploy.md for the one-time secret provisioning
# steps and the runtime SA IAM bindings.

on:
  # Auto-deploy on push is off until the rgleaderboard GCP project has
  # billing attached. Cloud Run + Cloud Build require a billing account
  # even at $0 usage. Uncomment the push block once billing is enabled.
  # push:
  #   branches: [main]
  #   paths:
  #     - "firebase/scripts/**"
  #     - "firebase/package.json"
  #     - "firebase/package-lock.json"
  #     - ".github/workflows/deploy-rebuild-service.yml"
  workflow_dispatch:
    inputs:
      project:
        description: GCP project ID
        required: false
        default: rgleaderboard

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-rebuild-service
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GCP_PROJECT: ${{ github.event.inputs.project || 'rgleaderboard' }}
      GCP_REGION: us-central1
      SERVICE_NAME: leaderboard-rebuild

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_SA_EMAIL }}
          token_format: access_token
          create_credentials_file: true

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: ${{ env.GCP_PROJECT }}

      - name: Deploy Cloud Run service
        run: |
          set -euo pipefail
          gcloud run deploy "$SERVICE_NAME" \
            --project "$GCP_PROJECT" \
            --region "$GCP_REGION" \
            --source firebase \
            --allow-unauthenticated \
            --command "npm" \
            --args "run,start:cloud-run" \
            --set-env-vars "FIREBASE_PROJECT=rgleaderboard,NODE_ENV=production" \
            --set-secrets "R2_ACCESS_KEY_ID=r2-access-key-id:latest,R2_SECRET_ACCESS_KEY=r2-secret-access-key:latest,R2_ACCOUNT_ID=r2-account-id:latest,R2_BUCKET=r2-bucket:latest,REBUILD_SHARED_SECRET=rebuild-shared-secret:latest" \
            --cpu 1 \
            --memory 512Mi \
            --concurrency 1 \
            --min-instances 0 \
            --max-instances 3 \
            --timeout 300s \
            --quiet

      - name: Print service URL
        run: |
          set -euo pipefail
          url="$(gcloud run services describe "$SERVICE_NAME" \
            --project "$GCP_PROJECT" \
            --region "$GCP_REGION" \
            --format='value(status.url)')"
          echo "Deployed $SERVICE_NAME at: $url"
          echo "SERVICE_URL=$url" >> "$GITHUB_STEP_SUMMARY"
