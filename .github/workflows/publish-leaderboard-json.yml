name: Publish leaderboard JSON

# Runs hourly. Reads Firestore via the existing WIF service account,
# builds one JSON blob per playlist, commits the results to the `data`
# branch of the public site repo so jsDelivr and GitHub raw can serve
# them. Frees the site + HUD from live Firestore subscriptions.
#
# Auth:
#   - GCP_WIF_PROVIDER + GCP_SA_EMAIL — same secrets as
#     firestore-aggregates.yml. Read-only Firestore access.
#   - PUBLIC_SITE_PAT — fine-grained personal access token with
#     contents:write on pal153/rg_player_leaderboard.
#     Create at https://github.com/settings/personal-access-tokens/new
#     and add as a repository secret named PUBLIC_SITE_PAT.

on:
  schedule:
    # Daily full re-scan at 10:13 UTC (3:13 AM CDT) — catches deletions and
    # any drift that the delta pipeline can't detect. The 15-min CDC delta
    # publishes are triggered externally via workflow_dispatch (cron-job.org)
    # because GitHub's own scheduler on public repos silently deprioritizes
    # frequent cron on free tier.
    - cron: "13 10 * * *"
  workflow_dispatch:
    inputs:
      project:
        description: GCP project ID
        required: false
        default: rgleaderboard
      force_full:
        description: Force full re-scan (ignore CDC state)
        type: boolean
        required: false
        default: false

permissions:
  contents: read
  id-token: write

concurrency:
  group: publish-leaderboard-json
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PROJECT: ${{ inputs.project || 'rgleaderboard' }}
      SITE_REPO: pal153/rg_player_leaderboard
      DATA_BRANCH: data

    steps:
      - name: Check out Tampermonkeys
        uses: actions/checkout@v7

      - name: Use Node 20
        uses: actions/setup-node@v7
        with:
          node-version: "20"

      - name: Install builder dependencies
        working-directory: firebase
        run: npm ci

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_SA_EMAIL }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: ${{ env.PROJECT }}

      - name: Check out site repo (data branch)
        uses: actions/checkout@v7
        with:
          repository: ${{ env.SITE_REPO }}
          ref: ${{ env.DATA_BRANCH }}
          token: ${{ secrets.PUBLIC_SITE_PAT }}
          path: site-repo
          fetch-depth: 1
        continue-on-error: true

      - name: Initialize data branch if missing
        run: |
          # actions/checkout with continue-on-error leaves a stub .git even
          # when the requested ref doesn't exist, so we can't gate on that
          # alone. Detect whether the data branch is actually checked out.
          if [ ! -d "$GITHUB_WORKSPACE/site-repo/.git" ]; then
            echo "site-repo checkout is missing entirely — cloning fresh"
            git clone --depth 1 --no-checkout \
              "https://x-access-token:${{ secrets.PUBLIC_SITE_PAT }}@github.com/${SITE_REPO}.git" \
              "$GITHUB_WORKSPACE/site-repo"
          fi
          cd "$GITHUB_WORKSPACE/site-repo"
          CURRENT_BRANCH=$(git rev-parse --abbrev-ref HEAD 2>/dev/null || echo "")
          if [ "$CURRENT_BRANCH" = "$DATA_BRANCH" ]; then
            echo "data branch already checked out"
            exit 0
          fi
          echo "data branch not checked out (current: '$CURRENT_BRANCH') — creating orphan"
          git checkout --orphan "$DATA_BRANCH"
          git rm -rf . 2>/dev/null || true
          echo "# Leaderboard JSON snapshots" > README.md
          echo "Auto-generated by Tampermonkeys publish-leaderboard-json.yml. Do not edit by hand." >> README.md
          git add README.md
          git -c user.name="rgleaderboard-bot" -c user.email="bot@rgleaderboard" commit -m "chore: init data branch"
          git push origin "$DATA_BRANCH"

      - name: Decide CDC mode
        id: cdc_mode
        run: |
          # Force a full re-scan on the daily 10:13 UTC cron entry or when a
          # workflow_dispatch caller sets force_full=true. Everything else
          # runs the CDC delta path (--state-dir points at persisted state
          # so the build script auto-falls-back to full when state is empty).
          FORCE_FULL="false"
          if [ "${{ github.event.schedule }}" = "13 10 * * *" ]; then
            FORCE_FULL="true"
          fi
          if [ "${{ github.event.inputs.force_full }}" = "true" ]; then
            FORCE_FULL="true"
          fi
          echo "force_full=$FORCE_FULL" >> "$GITHUB_OUTPUT"
          echo "Force full: $FORCE_FULL"

      - name: Build JSON blobs
        working-directory: firebase
        env:
          FORCE_FULL_FLAG: ${{ steps.cdc_mode.outputs.force_full == 'true' && '--force-full' || '' }}
        run: |
          mkdir -p "$GITHUB_WORKSPACE/site-repo/state"
          npm run build:leaderboard-cache -- \
            --project "$PROJECT" \
            --emit-json \
            --skip-firestore \
            --output-dir "$GITHUB_WORKSPACE/out" \
            --state-dir "$GITHUB_WORKSPACE/site-repo/state" \
            $FORCE_FULL_FLAG

      # Signed-out visitors can't read tournament_leaderboard directly
      # (admin-only rules), so publish a public JSON snapshot alongside
      # the other playlists. CDC on lastWriteAt keeps idle runs at 1 read.
      - name: Build tournament JSON
        working-directory: firebase
        continue-on-error: true
        env:
          FORCE_FULL_FLAG: ${{ steps.cdc_mode.outputs.force_full == 'true' && '--force-full' || '' }}
        run: |
          npm run publish:tournament-json -- \
            --project "$PROJECT" \
            --output-dir "$GITHUB_WORKSPACE/out" \
            --state-dir "$GITHUB_WORKSPACE/site-repo/state" \
            $FORCE_FULL_FLAG

      - name: Warn if we held new high-MMR rows
        run: |
          if [ -f "$GITHUB_WORKSPACE/out/held.json" ]; then
            count=$(node -e "const h=require('$GITHUB_WORKSPACE/out/held.json'); process.stdout.write(String(Array.isArray(h)?h.length:0))")
            if [ "$count" != "0" ]; then
              echo "::warning::Held $count new row(s) with huge MMR. See out/held.json"
              cat "$GITHUB_WORKSPACE/out/held.json"
            fi
          fi
          if [ -f "$GITHUB_WORKSPACE/out/security-events.jsonl" ]; then
            echo "::notice::security-events.jsonl"
            cat "$GITHUB_WORKSPACE/out/security-events.jsonl"
          fi

      - name: Upload security artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-events
          path: |
            out/held.json
            out/security-events.jsonl
          if-no-files-found: ignore
          retention-days: 90

      - name: Copy JSON blobs into site repo
        run: |
          mkdir -p "$GITHUB_WORKSPACE/site-repo/leaderboard"
          for f in 1v1 2v2 3v3 wins tournament; do
            if [ -f "$GITHUB_WORKSPACE/out/$f.json" ]; then
              cp "$GITHUB_WORKSPACE/out/$f.json" "$GITHUB_WORKSPACE/site-repo/leaderboard/"
            fi
          done
          ls -la "$GITHUB_WORKSPACE/site-repo/leaderboard/"

      - name: Commit and push
        working-directory: site-repo
        run: |
          git config user.name "rgleaderboard-bot"
          git config user.email "bot@rgleaderboard"
          git add leaderboard/ state/
          if git diff --staged --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "chore(data): refresh leaderboard JSON $(date -u +%Y-%m-%dT%H:%MZ)"
          git push origin "$DATA_BRANCH"
