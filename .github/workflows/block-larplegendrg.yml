name: Block LarpLegendRG

# Auto-mitigates spam/harassment from user LarpLegendRG:
#   - issues they open   → close, lock as spam, attempt hard-delete via GraphQL
#   - PRs they open      → close (delete branch when possible), lock as spam
#   - comments they post → minimize as SPAM via GraphQL
#
# Hard-delete requires admin permission on the repo; the default GITHUB_TOKEN
# has that when the workflow runs in-repo owned by wiljdaws. Close+lock is
# guaranteed even if delete fails.
#
# Copy this file verbatim into .github/workflows/ of any repo you want to
# protect. No secrets required.

on:
  issues:
    types: [opened, reopened, edited]
  pull_request_target:
    types: [opened, reopened, edited]
  issue_comment:
    types: [created, edited]
  pull_request_review_comment:
    types: [created, edited]
  workflow_dispatch:
    inputs:
      retro_purge:
        description: "Also scan and purge existing LarpLegendRG content"
        type: boolean
        required: false
        default: false

permissions:
  issues: write
  pull-requests: write
  contents: read

jobs:
  block:
    runs-on: ubuntu-latest
    env:
      TARGET_USER: LarpLegendRG
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
    steps:
      - name: Handle new issue
        if: >-
          github.event_name == 'issues' &&
          github.event.issue.user.login == 'LarpLegendRG'
        env:
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_NODE_ID: ${{ github.event.issue.node_id }}
        run: |
          set +e
          gh issue close "$ISSUE_NUMBER" --repo "$REPO" --reason "not planned"
          gh api -X PUT "repos/$REPO/issues/$ISSUE_NUMBER/lock" -f lock_reason=spam
          gh api graphql \
            -f query='mutation($id: ID!) { deleteIssue(input: {issueId: $id}) { repository { id } } }' \
            -f id="$ISSUE_NODE_ID"
          exit 0

      - name: Handle new pull request
        if: >-
          github.event_name == 'pull_request_target' &&
          github.event.pull_request.user.login == 'LarpLegendRG'
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set +e
          gh pr close "$PR_NUMBER" --repo "$REPO" --delete-branch \
            || gh pr close "$PR_NUMBER" --repo "$REPO"
          gh api -X PUT "repos/$REPO/issues/$PR_NUMBER/lock" -f lock_reason=spam
          exit 0

      - name: Handle new comment
        if: >-
          (github.event_name == 'issue_comment' || github.event_name == 'pull_request_review_comment') &&
          github.event.comment.user.login == 'LarpLegendRG'
        env:
          COMMENT_NODE_ID: ${{ github.event.comment.node_id }}
          COMMENT_ID: ${{ github.event.comment.id }}
        run: |
          set +e
          gh api graphql \
            -f query='mutation($id: ID!) { minimizeComment(input: {subjectId: $id, classifier: SPAM}) { minimizedComment { isMinimized } } }' \
            -f id="$COMMENT_NODE_ID"
          if [ "${{ github.event_name }}" = "issue_comment" ]; then
            gh api -X DELETE "repos/$REPO/issues/comments/$COMMENT_ID"
          else
            gh api -X DELETE "repos/$REPO/pulls/comments/$COMMENT_ID"
          fi
          exit 0

      - name: Retroactive purge (manual only)
        if: github.event_name == 'workflow_dispatch' && inputs.retro_purge
        run: |
          set +e
          echo "Scanning issues and PRs authored by $TARGET_USER..."
          # Issues + PRs (search API returns both)
          gh api -X GET "search/issues" \
            -f q="repo:$REPO author:$TARGET_USER" \
            --paginate --jq '.items[] | [.number, .node_id, .pull_request != null] | @tsv' \
            | while IFS=$'\t' read -r num nodeid is_pr; do
              if [ "$is_pr" = "true" ]; then
                echo "PR #$num — closing + locking"
                gh pr close "$num" --repo "$REPO" --delete-branch \
                  || gh pr close "$num" --repo "$REPO"
                gh api -X PUT "repos/$REPO/issues/$num/lock" -f lock_reason=spam
              else
                echo "Issue #$num — close, lock, delete"
                gh issue close "$num" --repo "$REPO" --reason "not planned"
                gh api -X PUT "repos/$REPO/issues/$num/lock" -f lock_reason=spam
                gh api graphql \
                  -f query='mutation($id: ID!) { deleteIssue(input: {issueId: $id}) { repository { id } } }' \
                  -f id="$nodeid"
              fi
            done

          echo "Scanning comments by $TARGET_USER..."
          # Comments across all issues in the repo
          gh api -X GET "repos/$REPO/issues/comments" --paginate \
            --jq ".[] | select(.user.login == \"$TARGET_USER\") | [.id, .node_id] | @tsv" \
            | while IFS=$'\t' read -r cid nodeid; do
              echo "issue-comment $cid — minimize + delete"
              gh api graphql \
                -f query='mutation($id: ID!) { minimizeComment(input: {subjectId: $id, classifier: SPAM}) { minimizedComment { isMinimized } } }' \
                -f id="$nodeid"
              gh api -X DELETE "repos/$REPO/issues/comments/$cid"
            done

          gh api -X GET "repos/$REPO/pulls/comments" --paginate \
            --jq ".[] | select(.user.login == \"$TARGET_USER\") | [.id, .node_id] | @tsv" \
            | while IFS=$'\t' read -r cid nodeid; do
              echo "pr-review-comment $cid — minimize + delete"
              gh api graphql \
                -f query='mutation($id: ID!) { minimizeComment(input: {subjectId: $id, classifier: SPAM}) { minimizedComment { isMinimized } } }' \
                -f id="$nodeid"
              gh api -X DELETE "repos/$REPO/pulls/comments/$cid"
            done
          exit 0
