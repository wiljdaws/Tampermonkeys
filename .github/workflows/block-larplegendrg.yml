name: Repo lockdown

on:
  issues:
    types: [opened, reopened, edited]
  pull_request_target:
    types: [opened, reopened, edited]
  issue_comment:
    types: [created, edited]
  pull_request_review_comment:
    types: [created, edited]
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      retro_purge:
        description: "Purge blocked-user content, non-owner PRs, and commit comments"
        type: boolean
        required: false
        default: false

permissions:
  issues: write
  pull-requests: write
  contents: write

jobs:
  lockdown:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
    steps:
      - name: Delete issue from blocked user
        if: >-
          github.event_name == 'issues' &&
          contains(fromJSON('["LarpLegendRG","HebrewAICoder","ManhatenHebrew"]'), github.event.issue.user.login)
        env:
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_NODE_ID: ${{ github.event.issue.node_id }}
        run: |
          set +e
          gh issue close "$ISSUE_NUMBER" --repo "$REPO" --reason "not planned"
          gh api -X PUT "repos/$REPO/issues/$ISSUE_NUMBER/lock" -f lock_reason=spam
          gh api graphql \
            -f query='mutation($id: ID!) { deleteIssue(input: {issueId: $id}) { repository { id } } }' \
            -f id="$ISSUE_NODE_ID"
          exit 0

      - name: Close PR unless author is allowed
        if: >-
          github.event_name == 'pull_request_target' &&
          !contains(fromJSON('["wiljdaws","HeBrews-Code","pal153"]'), github.event.pull_request.user.login)
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set +e
          gh pr close "$PR_NUMBER" --repo "$REPO" --delete-branch \
            || gh pr close "$PR_NUMBER" --repo "$REPO"
          gh api -X PUT "repos/$REPO/issues/$PR_NUMBER/lock" -f lock_reason=spam
          exit 0

      - name: Delete comment from blocked user
        if: >-
          (github.event_name == 'issue_comment' || github.event_name == 'pull_request_review_comment') &&
          contains(fromJSON('["LarpLegendRG","HebrewAICoder","ManhatenHebrew"]'), github.event.comment.user.login)
        env:
          COMMENT_NODE_ID: ${{ github.event.comment.node_id }}
          COMMENT_ID: ${{ github.event.comment.id }}
        run: |
          set +e
          gh api graphql \
            -f query='mutation($id: ID!) { minimizeComment(input: {subjectId: $id, classifier: SPAM}) { minimizedComment { isMinimized } } }' \
            -f id="$COMMENT_NODE_ID"
          if [ "${{ github.event_name }}" = "issue_comment" ]; then
            gh api -X DELETE "repos/$REPO/issues/comments/$COMMENT_ID"
          else
            gh api -X DELETE "repos/$REPO/pulls/comments/$COMMENT_ID"
          fi
          exit 0

      - name: Sweep commit comments
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          set +e
          gh api -X GET "repos/$REPO/comments" --paginate --jq '.[].id' \
            | while read -r cid; do
              gh api -X DELETE "repos/$REPO/comments/$cid"
            done
          exit 0

      - name: Retroactive purge
        if: github.event_name == 'workflow_dispatch' && inputs.retro_purge
        run: |
          set +e
          for user in LarpLegendRG HebrewAICoder ManhatenHebrew; do
            gh api -X GET "search/issues" \
              -f q="repo:$REPO author:$user" \
              --paginate --jq '.items[] | [.number, .node_id, .pull_request != null] | @tsv' \
              | while IFS=$'\t' read -r num nodeid is_pr; do
                if [ "$is_pr" = "true" ]; then
                  gh pr close "$num" --repo "$REPO" --delete-branch \
                    || gh pr close "$num" --repo "$REPO"
                  gh api -X PUT "repos/$REPO/issues/$num/lock" -f lock_reason=spam
                else
                  gh issue close "$num" --repo "$REPO" --reason "not planned"
                  gh api -X PUT "repos/$REPO/issues/$num/lock" -f lock_reason=spam
                  gh api graphql \
                    -f query='mutation($id: ID!) { deleteIssue(input: {issueId: $id}) { repository { id } } }' \
                    -f id="$nodeid"
                fi
              done
          done

          gh api -X GET "search/issues" \
            -f q="repo:$REPO is:pr is:open" \
            --paginate --jq '.items[] | [.number, .user.login] | @tsv' \
            | while IFS=$'\t' read -r num author; do
              case "$author" in
                wiljdaws|HeBrews-Code|pal153) ;;
                *)
                  gh pr close "$num" --repo "$REPO" --delete-branch \
                    || gh pr close "$num" --repo "$REPO"
                  gh api -X PUT "repos/$REPO/issues/$num/lock" -f lock_reason=spam
                  ;;
              esac
            done

          for user in LarpLegendRG HebrewAICoder ManhatenHebrew; do
            gh api -X GET "repos/$REPO/issues/comments" --paginate \
              --jq ".[] | select(.user.login == \"$user\") | [.id, .node_id] | @tsv" \
              | while IFS=$'\t' read -r cid nodeid; do
                gh api graphql \
                  -f query='mutation($id: ID!) { minimizeComment(input: {subjectId: $id, classifier: SPAM}) { minimizedComment { isMinimized } } }' \
                  -f id="$nodeid"
                gh api -X DELETE "repos/$REPO/issues/comments/$cid"
              done

            gh api -X GET "repos/$REPO/pulls/comments" --paginate \
              --jq ".[] | select(.user.login == \"$user\") | [.id, .node_id] | @tsv" \
              | while IFS=$'\t' read -r cid nodeid; do
                gh api graphql \
                  -f query='mutation($id: ID!) { minimizeComment(input: {subjectId: $id, classifier: SPAM}) { minimizedComment { isMinimized } } }' \
                  -f id="$nodeid"
                gh api -X DELETE "repos/$REPO/pulls/comments/$cid"
              done
          done
          exit 0
